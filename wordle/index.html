<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle for Kids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --green: #4ade80;
            --green-dark: #166534;
            --yellow: #fbbf24;
            --yellow-dark: #78350f;
            --grey: #475569;
            --grey-dark: #1e293b;
            --tile-size: 62px;
            --tile-gap: 6px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── Header ── */
        header {
            width: 100%;
            max-width: 500px;
            padding: 16px 20px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.04em;
        }

        #difficulty-badge {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 999px;
            border: 1.5px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        #difficulty-badge:hover { border-color: #60a5fa; color: #60a5fa; }

        /* ── Screens ── */
        #level-screen, #game-screen {
            width: 100%;
            max-width: 500px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        [hidden] { display: none !important; }

        /* ── Level select ── */
        #level-screen {
            justify-content: center;
            gap: 20px;
            padding: 40px 20px;
        }

        .level-title {
            font-size: 1.1rem;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }

        .level-btn {
            width: 260px;
            padding: 20px 32px;
            border-radius: 16px;
            border: 2px solid transparent;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 1.3rem;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }
        .level-btn span.sub {
            font-size: 0.85rem;
            font-weight: 400;
            opacity: 0.8;
        }
        .level-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .level-btn:active { transform: translateY(0); }

        .btn-easy {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #fff;
        }
        .btn-hard {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
        }

        /* ── Toast ── */
        #toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: var(--text);
            color: var(--bg);
            font-weight: 700;
            font-size: 0.95rem;
            padding: 10px 24px;
            border-radius: 999px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Board ── */
        #board-area {
            padding: 20px 0 12px;
            flex: 1;
            display: flex;
            align-items: center;
        }

        #board {
            display: grid;
            grid-template-rows: repeat(6, var(--tile-size));
            grid-template-columns: repeat(5, var(--tile-size));
            gap: var(--tile-gap);
        }

        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            perspective: 250px;
            transition: border-color 0.1s;
            position: relative;
        }

        .tile.filled { border-color: #64748b; }

        .tile-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            border-radius: 4px;
        }

        .tile.flip .tile-inner {
            animation: flip 0.5s ease forwards;
        }

        @keyframes flip {
            0%   { transform: rotateX(0deg); }
            45%  { transform: rotateX(-90deg); }
            55%  { transform: rotateX(-90deg); }
            100% { transform: rotateX(0deg); }
        }

        .tile.green  { border-color: var(--green); }
        .tile.yellow { border-color: var(--yellow); }
        .tile.grey   { border-color: var(--grey); }

        .tile.green  .tile-inner { background: var(--green-dark); color: var(--green); }
        .tile.yellow .tile-inner { background: var(--yellow-dark); color: var(--yellow); }
        .tile.grey   .tile-inner { background: #1e293b; color: #64748b; }

        .tile.pop { animation: pop 0.1s ease; }
        @keyframes pop {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .tile.shake { animation: shake 0.4s ease; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-5px); }
            40%       { transform: translateX(5px); }
            60%       { transform: translateX(-5px); }
            80%       { transform: translateX(5px); }
        }

        .tile.bounce { animation: bounce 0.6s ease; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            30%       { transform: translateY(-16px); }
            60%       { transform: translateY(-6px); }
        }

        /* ── Keyboard ── */
        #keyboard {
            padding: 8px 8px 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .kb-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .key {
            height: 54px;
            min-width: 40px;
            padding: 0 6px;
            border: none;
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.3s, color 0.3s, transform 0.1s;
            border: 1px solid var(--border);
        }

        .key.wide { min-width: 64px; font-size: 0.8rem; }
        .key:active { transform: scale(0.94); }

        .key.green  { background: var(--green-dark);  color: var(--green);  border-color: var(--green-dark);  }
        .key.yellow { background: var(--yellow-dark); color: var(--yellow); border-color: var(--yellow-dark); }
        .key.grey   { background: #1e293b;            color: #475569;       border-color: #1e293b;            }

        /* ── End banner ── */
        #end-banner {
            width: 100%;
            max-width: 500px;
            padding: 0 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        #end-message {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
        }
        #end-message.win  { color: var(--green); }
        #end-message.lose { color: #f87171; }

        .action-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

        .btn-new    { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; }
        .btn-menu   { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
        .btn-giveup { background: transparent; color: var(--muted); border: 1px solid var(--border); font-size: 0.85rem; padding: 8px 20px; }

        @media (max-width: 420px) {
            :root { --tile-size: 52px; --tile-gap: 5px; }
            .tile { font-size: 1.5rem; }
            .key { height: 46px; min-width: 32px; font-size: 0.78rem; }
            .key.wide { min-width: 52px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Wordle</div>
    <button id="difficulty-badge" hidden></button>
</header>

<div id="toast"></div>

<!-- Level select -->
<div id="level-screen">
    <p class="level-title">Choose difficulty</p>
    <button class="level-btn btn-easy" data-level="easy">
        Easy
        <span class="sub">Common, everyday words</span>
    </button>
    <button class="level-btn btn-hard" data-level="hard">
        Hard
        <span class="sub">Bigger vocabulary</span>
    </button>
</div>

<!-- Game -->
<div id="game-screen" hidden>
    <div id="board-area">
        <div id="board"></div>
    </div>
    <div id="give-up-area" style="padding:4px 0 0;display:flex;justify-content:center">
        <button class="action-btn btn-giveup" id="give-up-btn">Give up</button>
    </div>

    <div id="end-banner" hidden>
        <div id="end-message"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
            <button class="action-btn btn-new" id="new-game-btn">Play Again</button>
            <button class="action-btn btn-menu" id="menu-btn">Change Difficulty</button>
        </div>
    </div>
    <div id="keyboard"></div>
</div>

const diffBadge      = document.getElementById('difficulty-badge');
const toastEl        = document.getElementById('toast');

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, duration = 1800) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
}

// ── Level select ──────────────────────────────────────────────────────────────
document.querySelectorAll('.level-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        difficulty = btn.dataset.level;
        startGame();
    });
});

document.getElementById('new-game-btn').addEventListener('click', startGame);
document.getElementById('menu-btn').addEventListener('click', showLevelScreen);

document.getElementById('give-up-btn').addEventListener('click', () => {
    if (gameOver) return;
    gameOver = true;
    showEndBanner(false);
});

diffBadge.addEventListener('click', showLevelScreen);

function showLevelScreen() {
    gameScreen.hidden = true;
    levelScreen.hidden = false;
    diffBadge.hidden = true;
}

// ── Game init ─────────────────────────────────────────────────────────────────
function startGame() {
    const list = wordLists[difficulty];
    if (!list.length) { showToast('Word list not loaded yet…'); return; }

    targetWord  = list[Math.floor(Math.random() * list.length)];
    currentRow  = 0;
    currentTile = 0;
    gameOver    = false;
    board       = Array.from({ length: ROWS }, () => Array(COLS).fill(''));
    revealed    = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
    keyColors   = {};

    levelScreen.hidden = true;
    gameScreen.hidden  = false;
    endBanner.hidden   = true;
    document.getElementById('give-up-area').hidden = false;
    diffBadge.hidden   = false;
    diffBadge.textContent = difficulty === 'easy' ? 'Easy' : 'Hard';

    buildBoard();
    buildKeyboard();
}

// ── Board ─────────────────────────────────────────────────────────────────────
function buildBoard() {
    boardEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.id = `tile-${r}-${c}`;
            tile.innerHTML = '<div class="tile-inner"></div>';
            boardEl.appendChild(tile);
        }
    }
}

function getTile(r, c) { return document.getElementById(`tile-${r}-${c}`); }

function updateTile(r, c, letter) {
    const tile = getTile(r, c);
    tile.querySelector('.tile-inner').textContent = letter.toUpperCase();
    tile.classList.toggle('filled', letter !== '');
}

function revealRow(row, colors) {
    return new Promise(resolve => {
        for (let c = 0; c < COLS; c++) {
            const tile = getTile(row, c);
            const delay = c * 300;

            setTimeout(() => {
                tile.classList.add('flip');

                // At the midpoint of the flip, apply the color
                setTimeout(() => {
                    tile.classList.add(colors[c]);
                }, delay + 250);

                if (c === COLS - 1) {
                    setTimeout(resolve, delay + 600);
                }
            }, delay);
        }
    });
}

function shakeRow(row) {
    for (let c = 0; c < COLS; c++) {
        const tile = getTile(row, c);
        tile.classList.remove('shake');
        void tile.offsetWidth; // reflow
        tile.classList.add('shake');
    }
}

function bounceRow(row) {
    for (let c = 0; c < COLS; c++) {
        const tile = getTile(row, c);
        setTimeout(() => {
            tile.classList.remove('bounce');
            void tile.offsetWidth;
            tile.classList.add('bounce');
        }, c * 80);
    }
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
const KB_ROWS = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Enter','Z','X','C','V','B','N','M','⌫'],
];

function buildKeyboard() {
    keyboardEl.innerHTML = '';
    for (const row of KB_ROWS) {
        const rowEl = document.createElement('div');
        rowEl.className = 'kb-row';
        for (const key of row) {
            const btn = document.createElement('button');
            btn.className = 'key' + (key.length > 1 ? ' wide' : '');
            btn.textContent = key;
            btn.dataset.key = key;
            btn.addEventListener('click', () => handleKey(key === '⌫' ? 'Backspace' : key));
            rowEl.appendChild(btn);
        }
        keyboardEl.appendChild(rowEl);
    }
}

function updateKeyboard() {
    document.querySelectorAll('.key[data-key]').forEach(btn => {
        const k = btn.dataset.key.toLowerCase();
        if (keyColors[k]) {
            btn.className = 'key' + (btn.dataset.key.length > 1 ? ' wide' : '') + ' ' + keyColors[k];
        }
    });
}

// ── Wordle logic ──────────────────────────────────────────────────────────────
function getColors(guess, target) {
    const result = Array(COLS).fill('grey');
    const tArr   = target.split('');
    const used   = Array(COLS).fill(false);

    // Pass 1: exact matches
    for (let i = 0; i < COLS; i++) {
        if (guess[i] === tArr[i]) {
            result[i] = 'green';
            used[i]   = true;
        }
    }
    // Pass 2: wrong position
    for (let i = 0; i < COLS; i++) {
        if (result[i] === 'green') continue;
        for (let j = 0; j < COLS; j++) {
            if (!used[j] && guess[i] === tArr[j]) {
                result[i] = 'yellow';
                used[j]   = true;
                break;
            }
        }
    }
    return result;
}

const COLOR_PRIORITY = { green: 3, yellow: 2, grey: 1 };

function mergeKeyColor(letter, color) {
    const cur = keyColors[letter];
    if (!cur || COLOR_PRIORITY[color] > COLOR_PRIORITY[cur]) {
        keyColors[letter] = color;
    }
}

// ── Input handling ────────────────────────────────────────────────────────────
async function handleKey(key) {
    if (gameOver) return;

    if (key === 'Backspace' || key === '⌫') {
        if (currentTile > 0) {
            currentTile--;
            board[currentRow][currentTile] = '';
            updateTile(currentRow, currentTile, '');
        }
        return;
    }

    if (key === 'Enter') {
        if (currentTile < COLS) {
            showToast('Not enough letters');
            shakeRow(currentRow);
            return;
        }
        const guess = board[currentRow].join('');
        if (!wordLists.hard.includes(guess)) {
            showToast('Not a word');
            shakeRow(currentRow);
            return;
        }
        await submitGuess();
        return;
    }

    if (/^[a-zA-Z]$/.test(key)) {
        if (currentTile >= COLS) return;
        const letter = key.toLowerCase();
        board[currentRow][currentTile] = letter;
        updateTile(currentRow, currentTile, letter);
        // pop animation
        const tile = getTile(currentRow, currentTile);
        tile.classList.remove('pop');
        void tile.offsetWidth;
        tile.classList.add('pop');
        currentTile++;
    }
}

async function submitGuess() {
    const guess = board[currentRow].join('');
    const colors = getColors(guess, targetWord);

    // Disable input during animation
    gameOver = true;

    await revealRow(currentRow, colors);

    // Update keyboard colors
    for (let i = 0; i < COLS; i++) mergeKeyColor(guess[i], colors[i]);
    updateKeyboard();

    const won = colors.every(c => c === 'green');

    if (won) {
        bounceRow(currentRow);
        const msgs = ['Genius!', 'Magnificent!', 'Brilliant!', 'Great job!', 'Well done!', 'Phew!'];
        setTimeout(() => {
            showToast(msgs[Math.min(currentRow, msgs.length - 1)], 2500);
            showEndBanner(true);
        }, COLS * 300 + 200);
        return;
    }

    currentRow++;
    currentTile = 0;

    if (currentRow >= ROWS) {
        setTimeout(() => {
            showToast(targetWord.toUpperCase(), 3000);
            showEndBanner(false);
        }, 400);
        return;
    }

    gameOver = false;
}

function showEndBanner(won) {
    endBanner.hidden = false;
    document.getElementById('give-up-area').hidden = true;
    endMessage.className = won ? 'win' : 'lose';
    endMessage.textContent = won
        ? `You got it in ${currentRow}!`
        : `The word was ${targetWord.toUpperCase()}`;
}

// ── Physical keyboard ─────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (gameScreen.hidden) return;
    if (e.key === 'Enter' || e.key === 'Backspace') {
        e.preventDefault();
        handleKey(e.key);
    } else if (/^[a-zA-Z]$/.test(e.key)) {
        handleKey(e.key);
    }
});

// ── Boot ──────────────────────────────────────────────────────────────────────
loadWords();
</script>
</body>
</html>
